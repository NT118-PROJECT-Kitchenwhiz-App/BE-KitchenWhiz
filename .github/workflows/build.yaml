name: be-kitchenwhiz-app
on:
  push:
    branches: [main]
  
env:
  DOCKER_IMAGES: ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_PROJECT}}/${{ github.repository }}:${{ github.sha }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: Login registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v1
        id: buildx

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v2
        id: docker_build
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.output.name }}
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_PROJECT}}:${{ github.sha }}

      - name: Verify
        run: echo ${{ steps.docker_build.output.digest}}
