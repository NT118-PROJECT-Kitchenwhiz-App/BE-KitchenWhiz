name: be-kitchenwhiz-app
on:
  push:
    branches: [main]
  
env:
  DOCKER_IMAGES: ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_PROJECT}}:${{ github.sha }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: Login registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      
      - name: Build image
        run: docker build -t ${{ env.DOCKER_IMAGES }} .

      - name: Push image
        run: docker push ${{ env.DOCKER_IMAGES }}

